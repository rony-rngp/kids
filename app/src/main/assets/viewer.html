<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote Kids Monitor Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #121212;
            --surface-color: #1e1e1e;
            --on-surface-color: #ffffff;
            --error-color: #cf6679;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--on-surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
        }

        main {
            padding: 20px;
        }

        .section {
            margin-bottom: 24px;
        }

        .device-item {
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .device-item:hover {
            background-color: #333;
        }

        .device-info {
            display: flex;
            flex-direction: column;
        }

        .device-name {
            font-weight: bold;
            font-size: 1.05em;
        }

        .device-id {
            font-size: 0.85em;
            color: var(--secondary-color);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85em;
        }

        .dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
        }

        h2 {
            font-size: 1.2em;
            margin-bottom: 12px;
            color: var(--primary-color);
            border-bottom: 1px solid var(--primary-color);
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-group p {
            margin: 0;
            font-size: 0.9em;
            color: var(--secondary-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: var(--on-surface-color);
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            flex-grow: 1;
        }
        
        #deviceId {
            flex-grow: 1;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background-color: var(--primary-color);
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button.disconnect {
            background-color: var(--error-color);
        }
        
        button.disconnect:hover {
            background-color: #b04f5d;
        }

        #status {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #3a3a3a;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9em;
            overflow-y: auto;
        }

        #videoFeed {
            width: 100%;
            height: auto;
            border: 1px solid #3a3a3a;
            margin-top: 16px;
            display: none; /* Hidden by default */
            border-radius: 8px;
        }
        
        .controls {
            display: none; /* Hidden until connected */
            margin-top: 20px;
        }
        
        .control-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .control-row button {
            flex: 1;
            margin: 0 5px;
        }

        /* Tabs & New Views */
        .nav-tabs {
            display: flex;
            margin-bottom: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        .nav-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px;
            border-radius: 0;
            color: #888;
        }
        .nav-btn.active {
            background: var(--primary-color);
            color: white;
        }
        .nav-btn:hover:not(.active) {
            background: #333;
            color: white;
        }
        
        .contact-item {
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        .contact-name { font-weight: bold; }
        .contact-number { color: #aaa; font-size: 0.9em; }

        .gallery-item {
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            text-align: center;
            padding: 5px;
        }
        .gallery-thumb {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }
        .gallery-name {
            font-size: 0.8em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 4px;
        }
        
        /* Modal for Image Viewing */
        #imageModal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #fullImage {
            max-width: 90%;
            max-height: 80%;
            border: 2px solid white;
        }
        #closeModal {
            margin-top: 20px;
            background: var(--error-color);
            width: auto;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<div id="imageModal">
    <img id="fullImage" src="">
    <button id="closeModal" onclick="closeModal()">Close</button>
</div>

<div class="container">
    <header>
        <i class="fas fa-video"></i> Remote Kids Monitor
    </header>

    <main>
        <div class="section">
            <h2><i class="fas fa-link"></i> Connection</h2>
            <div class="input-group">
                <p>Enter the Device ID manually or select from the list below.</p>
                <div class="input-row">
                    <input type="text" id="deviceId" placeholder="Enter Device ID">
                </div>
                <div class="button-group">
                    <button id="btnConnect" onclick="connect()"><i class="fas fa-plug"></i> Connect</button>
                    <button id="btnDisconnect" class="disconnect" onclick="disconnect()" disabled><i class="fas fa-times"></i> Disconnect</button>
                </div>
            </div>
        </div>

        <div id="controls" class="controls">
            <div class="nav-tabs">
                <button class="nav-btn active" onclick="switchTab('monitor')" id="tab-monitor"><i class="fas fa-video"></i> Monitor</button>
                <button class="nav-btn" onclick="switchTab('contacts')" id="tab-contacts"><i class="fas fa-address-book"></i> Contacts</button>
                <button class="nav-btn" onclick="switchTab('gallery')" id="tab-gallery"><i class="fas fa-images"></i> Gallery</button>
            </div>

            <div id="monitorView">
                 <h2><i class="fas fa-gamepad"></i> Controls</h2>
                 <div class="control-row">
                     <button id="btnStartMonitor" onclick="startMonitoring()"><i class="fas fa-play"></i> Start Monitor</button>
                     <button id="btnStopMonitor" class="disconnect" onclick="stopMonitoring()" style="display: none;"><i class="fas fa-stop"></i> Stop Monitor</button>
                 </div>
                 <div class="control-row">
                     <button onclick="toggleCamera()"><i class="fas fa-sync-alt"></i> Switch Camera</button>
                     <button id="btnAudio" onclick="toggleAudio()"><i class="fas fa-microphone"></i> Start Audio</button>
                 </div>
                 <img id="videoFeed" alt="Video Stream" style="width: 100%; border-radius: 8px; border: 1px solid #3a3a3a; display: none; margin-top: 16px;">
            </div>

            <div id="contactsView" style="display:none;">
                <div class="section">
                    <h2><i class="fas fa-address-book"></i> Contacts <button onclick="loadContacts()" style="float:right; padding: 5px 10px; width:auto;"><i class="fas fa-sync"></i></button></h2>
                    <div id="contactsList" style="max-height: 400px; overflow-y: auto;">
                        <p style="text-align:center; color:#666; padding: 20px;">Click refresh to load.</p>
                    </div>
                </div>
            </div>

            <div id="galleryView" style="display:none;">
                 <div class="section">
                    <h2><i class="fas fa-images"></i> Gallery <button onclick="loadGallery()" style="float:right; padding: 5px 10px; width:auto;"><i class="fas fa-sync"></i></button></h2>
                    
                    <div id="galleryGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; max-height: 500px; overflow-y: auto;">
                        <p style="text-align:center; color:#666; grid-column: 1/-1; padding: 20px;">Click refresh to load.</p>
                    </div>

                    <div class="pagination-controls" style="margin-top: 15px; display: flex; justify-content: center; gap: 15px; align-items: center;">
                        <button id="btnPrevPage" onclick="prevPage()" disabled style="width: auto; padding: 8px 16px;"><i class="fas fa-chevron-left"></i> Prev</button>
                        <span id="pageIndicator" style="color: #fff;">Page 1</span>
                        <button id="btnNextPage" onclick="nextPage()" disabled style="width: auto; padding: 8px 16px;">Next <i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Moved Status and Device List below controls for better layout or keep them? 
             Actually, let's keep device list and status VISIBLE always, so user knows what's up.
             But "controls" div was hidden until connect. 
             So the tabs will only show when connected. Correct.
        -->

        <div class="section" style="margin-top: 20px;">
            <h2><i class="fas fa-list"></i> Registered Devices <button id="btnScan" onclick="scanDevices()" style="float: right; padding: 4px 8px; font-size: 0.8em; width: auto;"><i class="fas fa-sync-alt"></i></button></h2>
            <div id="deviceList">
                <p style="color: #666; font-size: 0.9em; text-align: center;">Loading devices...</p>
            </div>
        </div>

        <div class="section">
            <h2><i class="fas fa-info-circle"></i> Status</h2>
            <div id="status">Not Connected</div>
        </div>

    </main>
</div>

<script>
    const RELAY_SERVER_URL = "wss://mkl-monitor.onrender.com/";
    let ws;
    let isConnected = false;
    let deviceId = "";
    let audioCtx;
    let nextStartTime = 0;
    let isAudioOn = false;
    let isMonitoring = false;
    let audioQueue = [];
    let frameCount = 0;
    
    // UI Elements - Declared BEFORE use
    const statusDiv = document.getElementById('status');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const videoFeed = document.getElementById('videoFeed');
    const controlsDiv = document.getElementById('controls');
    const deviceIdInput = document.getElementById('deviceId');
    const btnStartMonitor = document.getElementById('btnStartMonitor');
    const btnStopMonitor = document.getElementById('btnStopMonitor');
    const btnAudio = document.getElementById('btnAudio');
    const deviceListDiv = document.getElementById('deviceList');
    const btnScan = document.getElementById('btnScan');

    let statusLog = [];

    function log(message) {
        const timestamp = new Date().toLocaleTimeString();
        statusLog.unshift(`[${timestamp}] ${message}`);
        if (statusLog.length > 7) statusLog.pop();
        statusDiv.innerHTML = statusLog.join('<br>');
    }

    function scanDevices() {
        btnScan.disabled = true;
        btnScan.innerHTML = '<i class="fas fa-sync-alt fa-spin"></i>';
        
        const scanWs = new WebSocket(RELAY_SERVER_URL);
        
        scanWs.onopen = () => {
            scanWs.send(JSON.stringify({ type: 'get_devices' }));
        };
        
        scanWs.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'device_list') {
                    deviceListDiv.innerHTML = '';
                    if (msg.devices.length === 0) {
                        deviceListDiv.innerHTML = '<p style="color: #666; font-size: 0.9em; text-align: center; padding: 10px;">No devices registered yet.</p>';
                    } else {
                        msg.devices.forEach(device => {
                            const item = document.createElement('div');
                            item.className = 'device-item';
                            const statusColor = device.online ? '#28a745' : '#6c757d';
                            const statusText = device.online ? 'Online' : 'Offline';
                            
                            item.innerHTML = `
                                <div class="device-info">
                                    <span class="device-name">${device.name}</span>
                                    <span class="device-id">ID: ${device.id}</span>
                                </div>
                                <div class="status-indicator">
                                    <div class="dot" style="background-color: ${statusColor}"></div>
                                    <span style="color: ${statusColor}">${statusText}</span>
                                </div>
                            `;
                            item.onclick = () => selectDevice(device.id);
                            deviceListDiv.appendChild(item);
                        });
                    }
                    scanWs.close(); // Close only after receiving the list
                }
            } catch(e) {
                console.error("Scan error", e);
            }
            // scanWs.close(); // Don't close here, wait for specific message
        };
        
        scanWs.onclose = () => {
             btnScan.disabled = false;
             btnScan.innerHTML = '<i class="fas fa-sync-alt"></i>';
        };
        
        scanWs.onerror = () => {
             btnScan.disabled = false;
             btnScan.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
        };
    }
    
    function selectDevice(id) {
        deviceIdInput.value = id;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = () => {
        scanDevices();
        // Auto refresh list every 30 seconds
        setInterval(scanDevices, 30000);
    };

    function connect() {
        const id = deviceIdInput.value.trim();
        if (!id) {
            alert("Please enter a Device ID");
            return;
        }
        
        // Validate ID exists (Optional: can be skipped if user wants to force connect)
        // We'll do a quick check via a temp socket or trust the user if they typed it manually?
        // User asked: "if click wrong id.. it still connect.. fix it"
        // So we MUST validate.
        
        log("Validating Device ID...");
        btnConnect.disabled = true;
        
        const valWs = new WebSocket(RELAY_SERVER_URL);
        valWs.onopen = () => valWs.send(JSON.stringify({ type: 'get_devices' }));
        valWs.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'device_list') {
                    const exists = msg.devices.find(d => d.id === id);
                    valWs.close();
                    
                    if (exists) {
                        if (!exists.online) {
                             if(!confirm(`Device "${exists.name}" is currently OFFLINE. Connect anyway?`)) {
                                 btnConnect.disabled = false;
                                 return;
                             }
                        }
                        startConnection(id);
                    } else {
                        alert("Device ID not found in server records.");
                        log("Error: Invalid Device ID");
                        btnConnect.disabled = false;
                    }
                }
            } catch(err) {
                valWs.close();
                startConnection(id); // Fallback on error
            }
        };
        valWs.onerror = () => {
             valWs.close();
             startConnection(id); // Fallback
        };
    }

    function startConnection(id) {
        deviceId = id;
        log("Connecting to Relay Server...");
        
        ws = new WebSocket(RELAY_SERVER_URL);
        ws.binaryType = 'arraybuffer'; 

        ws.onopen = () => {
            log("Connected to Server.");
            isConnected = true;
            updateUI(true); // Show controls IMMEDIATELY
            
            // Register as viewer
            const registerMsg = {
                type: 'register_viewer',
                deviceId: deviceId
            };
            ws.send(JSON.stringify(registerMsg));
            
            // Start Heartbeat
            heartbeatInterval = setInterval(() => {
                if (isConnected) sendCommand('ping');
            }, 3000);
            
            // Init Audio
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {
                console.warn("Audio init failed", e);
            }
        };

        ws.onmessage = (event) => {
            const data = event.data;
            
            if (typeof data === 'string') {
                handleJsonData(data);
            } else if (data instanceof ArrayBuffer || data instanceof Blob) {
                handleBinaryData(data);
            }
        };

        ws.onclose = (e) => {
            log(`Disconnected (Code: ${e.code})`);
            isConnected = false;
            clearInterval(heartbeatInterval);
            updateUI(false);
            isMonitoring = false;
            updateControlButtons();
        };

        ws.onerror = (e) => {
            log("Connection Error");
            console.error(e);
            clearInterval(heartbeatInterval);
        };
    }

    function disconnect() {
        if (isConnected) {
            // Try to send stop command before closing, just in case
            if (isMonitoring) stopMonitoring();
            if (isAudioOn) sendCommand('audioOff');
        }
        
        if (ws) ws.close();
        clearInterval(heartbeatInterval);
        
        // Reset local state immediately
        isMonitoring = false;
        isAudioOn = false;
        updateControlButtons();
    }

    function updateUI(connected) {
        btnConnect.style.display = connected ? 'none' : 'flex';
        btnDisconnect.style.display = connected ? 'flex' : 'none';
        btnDisconnect.disabled = !connected;
        deviceIdInput.disabled = connected;
        if (connected) {
            controlsDiv.style.display = 'block'; 
        } else {
            controlsDiv.style.display = 'none';
        }
    }

    function handleJsonData(jsonString) {
        try {
            const msg = JSON.parse(jsonString);
            console.log("RX:", msg);
            
            if (msg.type === 'status') {
                if (msg.message === 'camera_online') {
                    log("Server: Camera reported ONLINE.");
                } else if (msg.message === 'camera_offline') {
                    log("Server: Camera reported OFFLINE (Commands may not work).");
                } else {
                    log(`Server: ${msg.message}`);
                    if (msg.message === 'Monitoring started') { isMonitoring = true; updateControlButtons(); }
                    if (msg.message === 'Monitoring stopped') { isMonitoring = false; updateControlButtons(); }
                    if (msg.message === 'Audio started') { isAudioOn = true; updateControlButtons(); }
                    if (msg.message === 'Audio stopped') { isAudioOn = false; updateControlButtons(); }
                }
            }
            else if (msg.type === 'contacts_list') {
                // msg.data is { data: "[...]" }
                const contacts = JSON.parse(msg.data.data);
                const list = document.getElementById('contactsList');
                list.innerHTML = '';
                if (contacts.length === 0) {
                     list.innerHTML = '<p style="text-align:center; color:#666; padding: 20px;">No contacts found.</p>';
                } else {
                    contacts.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'contact-item';
                        div.innerHTML = `<div class="contact-name">${c.name}</div><div class="contact-number">${c.phoneNumber}</div>`;
                        list.appendChild(div);
                    });
                }
                log(`Loaded ${contacts.length} contacts.`);
            }
            else if (msg.type === 'gallery_list') {
                const images = JSON.parse(msg.data.data);
                // msg.data.offset might be string, parse it
                const returnedOffset = parseInt(msg.data.offset) || 0;
                
                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = '';
                
                // Update Pagination Controls
                const pageNum = (returnedOffset / 50) + 1;
                document.getElementById('pageIndicator').innerText = "Page " + pageNum;
                document.getElementById('btnPrevPage').disabled = (returnedOffset === 0);
                document.getElementById('btnNextPage').disabled = (images.length < 50);

                if (images.length === 0) {
                     grid.innerHTML = '<p style="text-align:center; color:#666; grid-column: 1/-1; padding: 20px;">No images found (or end of list).</p>';
                } else {
                    images.forEach(img => {
                        const div = document.createElement('div');
                        div.className = 'gallery-item';
                        div.onclick = () => requestImage(img.id);
                        // Convert timestamp to date string
                        const dateStr = new Date(img.date * 1000).toLocaleDateString();
                        
                        let thumbHtml = `<i class="fas fa-image fa-2x"></i>`;
                        if (img.thumbnail) {
                            thumbHtml = `<img src="data:image/jpeg;base64,${img.thumbnail}" style="width:100%; height:100%; object-fit:cover;">`;
                        }
                        
                        div.innerHTML = `
                            <div class="gallery-thumb" id="thumb-${img.id}">${thumbHtml}</div>
                            <div class="gallery-name">${img.name}</div>
                            <div style="font-size:0.7em; color:#666;">${dateStr}</div>
                        `;
                        grid.appendChild(div);
                    });
                }
                log(`Loaded ${images.length} images (Page ${pageNum}).`);
            }
            else if (msg.type === 'gallery_image') {
                const id = msg.data.id;
                const base64 = msg.data.data;
                const imgSrc = "data:image/jpeg;base64," + base64;
                
                // If modal is open, show there
                const modal = document.getElementById('imageModal');
                if (modal.style.display === 'flex') {
                    document.getElementById('fullImage').src = imgSrc;
                }
            }
        } catch (e) {
            console.error("Parse Error", e);
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        
        document.getElementById('monitorView').style.display = 'none';
        document.getElementById('contactsView').style.display = 'none';
        document.getElementById('galleryView').style.display = 'none';
        
        document.getElementById(tab + 'View').style.display = 'block';
    }

    function loadContacts() {
        document.getElementById('contactsList').innerHTML = '<p style="text-align:center; color:#666; padding: 20px;">Loading...</p>';
        sendCommand('get_contacts');
    }

    function loadGallery() {
        document.getElementById('galleryGrid').innerHTML = '<p style="text-align:center; color:#666; grid-column: 1/-1; padding: 20px;">Loading...</p>';
        sendCommand('get_gallery');
    }

    function requestImage(id) {
        document.getElementById('imageModal').style.display = 'flex';
        document.getElementById('fullImage').src = ''; // Clear previous
        // Show loading state in modal?
        sendCommand('get_image', { id: id.toString() });
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }


    function handleBinaryData(data) {
        if (data instanceof Blob) {
             const reader = new FileReader();
             reader.onload = function() { processArrayBuffer(this.result); };
             reader.readAsArrayBuffer(data);
        } else {
             processArrayBuffer(data);
        }
    }

    function processArrayBuffer(buffer) {
        try {
            const bytes = new Uint8Array(buffer);
            // Basic JPEG check: SOI (FF D8)
            if (bytes.length > 1000 && bytes[0] === 0xFF && bytes[1] === 0xD8) {
                frameCount++;
                if (frameCount % 100 === 0) console.log(`Rx Video Frame #${frameCount} (${bytes.length} bytes)`);
                
                const blob = new Blob([buffer], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                videoFeed.onload = () => URL.revokeObjectURL(url);
                videoFeed.src = url;
            } else {
                playAudioChunk(buffer);
            }
        } catch (e) {
            console.warn("Binary processing failed, attempting text decode:", e);
            try {
                const text = new TextDecoder("utf-8").decode(buffer);
                if (text.trim().startsWith('{')) {
                    handleJsonData(text);
                }
            } catch (err) {
                console.error("Recovery failed", err);
            }
        }
    }

    function sendCommand(type, data = {}) {
        if (!ws || !isConnected) return;
        const cmd = {
            type: 'command',
            data: {
                type: type,
                data: JSON.stringify(data)
            }
        };
        ws.send(JSON.stringify(cmd));
        log(`Sent command: ${type}`);
    }
    
    function startMonitoring() {
        sendCommand('startMonitoring');
        isMonitoring = true;
        updateControlButtons();
    }

    function stopMonitoring() {
        sendCommand('stopMonitoring');
        isMonitoring = false;
        // Also stop audio if monitoring stops
        if (isAudioOn) {
            isAudioOn = false;
            sendCommand('audioOff');
        }
        updateControlButtons();
    }

    function toggleAudio() {
        if (isAudioOn) {
            sendCommand('audioOff');
            isAudioOn = false;
            log("Audio OFF command sent");
        } else {
            sendCommand('audioOn');
            isAudioOn = true;
            log("Audio ON command sent");
        }
        updateControlButtons();
    }
    
    function updateControlButtons() {
        if (isMonitoring) {
            btnStartMonitor.style.display = 'none';
            btnStopMonitor.style.display = 'block';
            videoFeed.style.display = 'block';
        } else {
            btnStartMonitor.style.display = 'block';
            btnStopMonitor.style.display = 'none';
            videoFeed.style.display = 'none';
            videoFeed.src = "";
        }
        
        if (isAudioOn) {
            btnAudio.innerHTML = '<i class="fas fa-microphone-slash"></i> Stop Audio';
            btnAudio.classList.remove('disconnect'); 
            btnAudio.classList.add('disconnect'); // Make it red
        } else {
            btnAudio.innerHTML = '<i class="fas fa-microphone"></i> Start Audio';
            btnAudio.classList.remove('disconnect');
        }
    }

    let currentCameraFacing = 'back';
    let galleryOffset = 0;
    const GALLERY_LIMIT = 50;

    function toggleCamera() {
        currentCameraFacing = (currentCameraFacing === 'back') ? 'front' : 'back';
        sendCommand('switchCamera', { facing: currentCameraFacing });
        log(`Switching to ${currentCameraFacing} camera...`);
    }
    
    // --- Gallery Pagination ---

    function loadGallery() {
        galleryOffset = 0; // Reset to start
        fetchGallery();
    }
    
    function fetchGallery() {
        document.getElementById('galleryGrid').innerHTML = '<p style="text-align:center; color:#666; grid-column: 1/-1; padding: 20px;">Loading...</p>';
        document.getElementById('btnPrevPage').disabled = true;
        document.getElementById('btnNextPage').disabled = true;
        
        sendCommand('get_gallery', { 
            limit: GALLERY_LIMIT.toString(), 
            offset: galleryOffset.toString() 
        });
    }

    function nextPage() {
        galleryOffset += GALLERY_LIMIT;
        fetchGallery();
    }

    function prevPage() {
        galleryOffset -= GALLERY_LIMIT;
        if (galleryOffset < 0) galleryOffset = 0;
        fetchGallery();
    }

    // --- End Pagination ---

    function playAudioChunk(arrayBuffer) {
        if (!audioCtx) return;
        const int16Data = new Int16Array(arrayBuffer);
        const float32Data = new Float32Array(int16Data.length);
        for (let i = 0; i < int16Data.length; i++) {
            float32Data[i] = int16Data[i] / 32768.0;
        }
        // Match Android Sample Rate (16000 Hz)
        const buffer = audioCtx.createBuffer(1, float32Data.length, 16000); 
        buffer.getChannelData(0).set(float32Data);
        
        const currentTime = audioCtx.currentTime;
        
        // --- Low Latency Logic ---
        
        // 1. Clean up finished nodes
        // (Actual cleanup happens via onended below)
        
        // 2. Underrun: System ran dry. Reset.
        if (nextStartTime < currentTime) {
            nextStartTime = currentTime;
        }
        
        // 3. Overrun/Drift: We are too far behind real-time (> 500ms)
        if (nextStartTime > currentTime + 0.5) {
            // console.log("Audio Latency High: Resyncing...");
            // Stop all currently scheduled/playing nodes to flush the queue
            audioQueue.forEach(node => {
                try { node.stop(); } catch(e) {}
            });
            audioQueue = [];
            
            // Jump to now
            nextStartTime = currentTime;
        }
        
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(nextStartTime);
        
        // Add to queue for potential cancellation
        audioQueue.push(source);
        // Remove from queue when done (optional optimization to keep array small)
        source.onended = () => {
             const index = audioQueue.indexOf(source);
             if (index > -1) audioQueue.splice(index, 1);
        };
        
        nextStartTime += buffer.duration;
    }
</script>
