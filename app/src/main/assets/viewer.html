<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remote Kids Monitor Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #121212;
            --surface-color: #1e1e1e;
            --on-surface-color: #ffffff;
            --error-color: #cf6679;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--on-surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--surface-color);
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
        }

        main {
            padding: 20px;
        }

        .section {
            margin-bottom: 24px;
        }

        h2 {
            font-size: 1.2em;
            margin-bottom: 12px;
            color: var(--primary-color);
            border-bottom: 1px solid var(--primary-color);
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-group p {
            margin: 0;
            font-size: 0.9em;
            color: var(--secondary-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: var(--on-surface-color);
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background-color: var(--primary-color);
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button.disconnect {
            background-color: var(--error-color);
        }
        
        button.disconnect:hover {
            background-color: #b04f5d;
        }

        #status {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #3a3a3a;
            background-color: #2a2a2a;
            border-radius: 8px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9em;
            overflow-y: auto;
        }

        #videoFeed {
            width: 100%;
            height: auto;
            border: 1px solid #3a3a3a;
            margin-top: 16px;
            display: none; /* Hidden by default */
            border-radius: 8px;
        }
        
        .controls {
            display: none; /* Hidden until connected */
            margin-top: 20px;
        }
        
        .control-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .control-row button {
            flex: 1;
            margin: 0 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <i class="fas fa-video"></i> Remote Kids Monitor
    </header>

    <main>
        <div class="section">
            <h2><i class="fas fa-link"></i> Connection</h2>
            <div class="input-group">
                <p>Enter the 6-Digit Device ID of the Android device.</p>
                <input type="text" id="deviceId" placeholder="Enter Device ID">
                <div class="button-group">
                    <button id="btnConnect" onclick="connect()"><i class="fas fa-plug"></i> Connect</button>
                    <button id="btnDisconnect" class="disconnect" onclick="disconnect()" disabled><i class="fas fa-times"></i> Disconnect</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2><i class="fas fa-info-circle"></i> Status</h2>
            <div id="status">Not Connected</div>
        </div>
        
        <div id="controls" class="controls">
             <h2><i class="fas fa-gamepad"></i> Controls</h2>
             <div class="control-row">
                 <button onclick="sendCommand('startMonitoring')"><i class="fas fa-play"></i> Start Monitor</button>
                 <button class="disconnect" onclick="sendCommand('stopMonitoring')"><i class="fas fa-stop"></i> Stop Monitor</button>
             </div>
             <div class="control-row">
                 <button onclick="toggleCamera()"><i class="fas fa-sync-alt"></i> Switch Camera</button>
                 <button onclick="toggleAudio()"><i class="fas fa-microphone"></i> Toggle Audio</button>
             </div>
        </div>

        <img id="videoFeed" alt="Video Stream">
    </main>
</div>

<script>
    const RELAY_SERVER_URL = "wss://mkl-monitor.onrender.com/";
    let ws;
    let isConnected = false;
    let deviceId = "";
    let audioCtx;
    let nextStartTime = 0;
    let isAudioOn = false;
    
    // UI Elements
    const statusDiv = document.getElementById('status');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const videoFeed = document.getElementById('videoFeed');
    const controlsDiv = document.getElementById('controls');
    const deviceIdInput = document.getElementById('deviceId');

    function log(message) {
        const timestamp = new Date().toLocaleTimeString();
        statusDiv.innerHTML = `[${timestamp}] ${message}<br>` + statusDiv.innerHTML;
    }

        let heartbeatInterval;

    function connect() {
        deviceId = deviceIdInput.value.trim();
        if (!deviceId) {
            alert("Please enter a Device ID");
            return;
        }

        log("Connecting to Relay Server...");
        
        ws = new WebSocket(RELAY_SERVER_URL);
        ws.binaryType = 'arraybuffer'; 

        ws.onopen = () => {
            log("Connected to Server.");
            isConnected = true;
            updateUI(true); // Show controls IMMEDIATELY
            
            // Register as viewer
            const registerMsg = {
                type: 'register_viewer',
                deviceId: deviceId
            };
            ws.send(JSON.stringify(registerMsg));
            
            // Start Heartbeat
            heartbeatInterval = setInterval(() => {
                if (isConnected) sendCommand('ping');
            }, 3000);
            
            // Init Audio
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {
                console.warn("Audio init failed", e);
            }
        };

        ws.onmessage = (event) => {
            const data = event.data;
            
            if (typeof data === 'string') {
                handleJsonData(data);
            } else if (data instanceof ArrayBuffer || data instanceof Blob) {
                handleBinaryData(data);
            }
        };

        ws.onclose = (e) => {
            log(`Disconnected (Code: ${e.code})`);
            isConnected = false;
            clearInterval(heartbeatInterval);
            updateUI(false);
        };

        ws.onerror = (e) => {
            log("Connection Error");
            console.error(e);
            clearInterval(heartbeatInterval);
        };
    }

    function disconnect() {
        if (ws) ws.close();
        clearInterval(heartbeatInterval);
    }

    function updateUI(connected) {
        btnConnect.disabled = connected;
        btnDisconnect.disabled = !connected;
        deviceIdInput.disabled = connected;
        if (connected) {
            controlsDiv.style.display = 'block'; 
            videoFeed.style.display = 'block';
        } else {
            controlsDiv.style.display = 'none';
            videoFeed.style.display = 'none';
        }
    }

    function handleJsonData(jsonString) {
        try {
            const msg = JSON.parse(jsonString);
            console.log("RX:", msg);
            
            if (msg.type === 'status') {
                if (msg.message === 'camera_online') {
                    log("Server: Camera reported ONLINE.");
                } else if (msg.message === 'camera_offline') {
                    log("Server: Camera reported OFFLINE (Commands may not work).");
                } else {
                    log(`Server: ${msg.message}`);
                }
            }
        } catch (e) {
            console.error("Parse Error", e);
        }
    }

    function handleBinaryData(data) {
        if (data instanceof Blob) {
             const reader = new FileReader();
             reader.onload = function() { processArrayBuffer(this.result); };
             reader.readAsArrayBuffer(data);
        } else {
             processArrayBuffer(data);
        }
    }

    function processArrayBuffer(buffer) {
        const bytes = new Uint8Array(buffer);
        if (bytes.length > 1000 && bytes[0] === 0xFF && bytes[1] === 0xD8) {
            const blob = new Blob([buffer], { type: 'image/jpeg' });
            const url = URL.createObjectURL(blob);
            videoFeed.onload = () => URL.revokeObjectURL(url);
            videoFeed.src = url;
            videoFeed.style.display = 'block';
        } else {
            playAudioChunk(buffer);
        }
    }

    function sendCommand(type, data = {}) {
        if (!ws || !isConnected) return;
        const cmd = {
            type: 'command',
            data: {
                type: type,
                data: JSON.stringify(data)
            }
        };
        ws.send(JSON.stringify(cmd));
        log(`Sent command: ${type}`);
    }
    
    function toggleAudio() {
        if (isAudioOn) {
            sendCommand('audioOff');
            isAudioOn = false;
            log("Audio OFF command sent");
        } else {
            sendCommand('audioOn');
            isAudioOn = true;
            log("Audio ON command sent");
        }
    }

    let currentCameraFacing = 'back';

    function toggleCamera() {
        currentCameraFacing = (currentCameraFacing === 'back') ? 'front' : 'back';
        sendCommand('switchCamera', { facing: currentCameraFacing });
        log(`Switching to ${currentCameraFacing} camera...`);
    }

    // ...

    function playAudioChunk(arrayBuffer) {
        if (!audioCtx) return;
        const int16Data = new Int16Array(arrayBuffer);
        const float32Data = new Float32Array(int16Data.length);
        for (let i = 0; i < int16Data.length; i++) {
            float32Data[i] = int16Data[i] / 32768.0;
        }
        // Match Android Sample Rate (16000 Hz)
        const buffer = audioCtx.createBuffer(1, float32Data.length, 16000); 
        buffer.getChannelData(0).set(float32Data);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        const currentTime = audioCtx.currentTime;
        if (nextStartTime < currentTime) nextStartTime = currentTime;
        source.start(nextStartTime);
        nextStartTime += buffer.duration;
    }
</script>

</body>
</html>
